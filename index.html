<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>배당주 적립기</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-light: #eff6ff;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --success: #059669;
      --success-light: #ecfdf5;
      --text: #111827;
      --subtext: #6b7280;
      --border: #e5e7eb;
      --shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      padding: 16px 14px 48px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 2px;
    }

    header h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .reset-btn {
      background: #fff;
      border: 1px solid var(--border);
      color: var(--subtext);
      font-size: 0.78rem;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .reset-btn:active {
      background: #f3f4f6;
    }

    .nav-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: #e5e7eb;
      padding: 4px;
      border-radius: 12px;
    }

    .nav-btn {
      border: none;
      background: transparent;
      padding: 9px 10px;
      border-radius: 9px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--subtext);
      cursor: pointer;
    }

    .nav-btn.active {
      background: var(--card);
      color: var(--text);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .view {
      display: none;
      flex-direction: column;
      gap: 14px;
    }

    .view.active {
      display: flex;
    }

    /* 상단 3개 종목 구분 카드 */
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .tab-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 10px 7px;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
    }

    .tab-card.active {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .tab-select-area {
      cursor: pointer;
    }

    .tab-badge {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tab-name-edit {
      display: flex;
      align-items: center;
      gap: 4px;
      width: 100%;
    }

    .tab-name-input {
      flex: 1;
      min-width: 0;
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #ffffff;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text);
      padding: 5px 5px;
      line-height: 1.25;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
      touch-action: manipulation;
    }

    .tab-name-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
    }

    .tab-apply-btn {
      width: 22px;
      height: 22px;
      min-width: 22px;
      border: none;
      border-radius: 50%;
      background: var(--primary);
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 800;
      line-height: 1;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .tab-apply-btn:active {
      background: var(--primary-dark);
      transform: scale(0.92);
    }

    .tab-count {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--text);
      cursor: pointer;
    }

    .counter-card,
    .confirm-card,
    .history-card {
      background: var(--card);
      border-radius: 20px;
      padding: 16px 14px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .selected-title {
      text-align: center;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--primary-dark);
      background: var(--primary-light);
      padding: 8px 12px;
      border-radius: 10px;
      word-break: keep-all;
    }

    .counter-body {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .circle-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .circle-dial {
      width: 175px;
      height: 175px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #3b82f6, #1d4ed8);
      color: #ffffff;
      border: 6px solid #dbeafe;
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.28);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      padding: 10px;
    }

    .circle-dial:active {
      transform: scale(0.95);
    }

    .dial-label {
      font-size: 0.72rem;
      opacity: 0.85;
      margin-bottom: 2px;
    }

    .dial-number {
      font-size: 2.1rem;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
      word-break: break-all;
      text-align: center;
    }

    .dial-hint {
      font-size: 0.72rem;
      margin-top: 6px;
      background: rgba(255, 255, 255, 0.18);
      padding: 2px 8px;
      border-radius: 999px;
    }

    .step-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      width: 124px;
      flex-shrink: 0;
    }

    .step-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .step-btn {
      border: none;
      border-radius: 9px;
      padding: 9px 4px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }

    .step-btn:active {
      transform: scale(0.94);
    }

    .step-btn.plus {
      background: var(--primary-light);
      color: var(--primary-dark);
      border: 1px solid #bfdbfe;
    }

    .step-btn.minus {
      background: var(--danger-light);
      color: var(--danger);
      border: 1px solid #fecaca;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 800;
      margin: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .section-sub {
      font-size: 0.74rem;
      font-weight: 500;
      color: var(--subtext);
    }

    .dividend-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .dividend-row {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      background: #fafafa;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dividend-row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .dividend-stock-name {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--text);
    }

    .dividend-stock-qty {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--primary);
      white-space: nowrap;
    }

    .dividend-row-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .input-group {
      display: flex;
      align-items: center;
      background: #fff;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 6px 10px;
      flex: 1;
    }

    .input-group input {
      width: 100%;
      border: none;
      outline: none;
      font-size: 0.92rem;
      font-weight: 700;
      text-align: right;
      color: var(--text);
      background: transparent;
      user-select: text;
      -webkit-user-select: text;
    }

    .input-unit {
      font-size: 0.8rem;
      color: var(--subtext);
      margin-left: 4px;
      white-space: nowrap;
    }

    .row-subtotal {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
      min-width: 105px;
      text-align: right;
    }

    .confirm-total-box {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #ffffff;
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .confirm-total-label {
      font-size: 0.8rem;
      color: #cbd5e1;
      display: flex;
      justify-content: space-between;
    }

    .confirm-total-amount {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-align: right;
      color: #38bdf8;
    }

    .total-box {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #ffffff;
      border-radius: 18px;
      padding: 18px 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .total-label {
      font-size: 0.85rem;
      color: #cbd5e1;
      display: flex;
      justify-content: space-between;
    }

    .total-amount {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-align: right;
      color: #38bdf8;
    }

    .confirm-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .month-input {
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
      background: #fff;
    }

    .confirm-btn {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.95rem;
      font-weight: 800;
      background: var(--success);
      color: #ffffff;
      cursor: pointer;
    }

    .confirm-btn:active {
      transform: scale(0.98);
    }

    .confirm-message {
      font-size: 0.78rem;
      color: var(--success);
      font-weight: 700;
      min-height: 18px;
    }

    .history-item {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      background: #fafafa;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-month {
      font-size: 0.95rem;
      font-weight: 800;
    }

    .history-total {
      font-size: 1rem;
      font-weight: 800;
      color: var(--primary-dark);
    }

    .history-detail {
      font-size: 0.78rem;
      color: var(--subtext);
      line-height: 1.45;
    }

    .history-actions {
      display: flex;
      justify-content: flex-end;
    }

    .delete-btn {
      border: 1px solid #fecaca;
      background: var(--danger-light);
      color: var(--danger);
      border-radius: 7px;
      padding: 4px 9px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      padding: 28px 12px;
      color: var(--subtext);
      font-size: 0.85rem;
    }

    @media (max-width: 360px) {
      .circle-dial {
        width: 148px;
        height: 148px;
      }
      .dial-number {
        font-size: 1.75rem;
      }
      .step-controls {
        width: 112px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>📈 배당주 적립기</h1>
      <button class="reset-btn" onclick="resetAll()">전체 초기화</button>
    </header>

    <div class="nav-tabs">
      <button class="nav-btn active" id="nav-tracker" onclick="switchView('tracker')">📊 적립기</button>
      <button class="nav-btn" id="nav-history" onclick="switchView('history')">📅 월별 확정 내역</button>
    </div>

    <div class="view active" id="view-tracker">
      <!-- 상단 3개 종목 구분 -->
      <div class="tabs" id="tabs"></div>

      <!-- 가운데 원형 숫자판 및 우측 증감 버튼 -->
      <div class="counter-card">
        <div class="selected-title" id="selectedTitle"></div>
        <div class="counter-body">
          <div class="circle-wrap">
            <div class="circle-dial" id="circleDial" onclick="changeCount(1)">
              <span class="dial-label">보유 수량</span>
              <span class="dial-number" id="dialNumber">0</span>
              <span class="dial-hint">터치 +1주</span>
            </div>
          </div>

          <div class="step-controls">
            <div class="step-col">
              <button class="step-btn plus" onclick="changeCount(1)">+1</button>
              <button class="step-btn plus" onclick="changeCount(10)">+10</button>
              <button class="step-btn plus" onclick="changeCount(100)">+100</button>
              <button class="step-btn plus" onclick="changeCount(1000)">+1000</button>
            </div>
            <div class="step-col">
              <button class="step-btn minus" onclick="changeCount(-1)">-1</button>
              <button class="step-btn minus" onclick="changeCount(-10)">-10</button>
              <button class="step-btn minus" onclick="changeCount(-100)">-100</button>
              <button class="step-btn minus" onclick="changeCount(-1000)">-1000</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 이달의 배당금 확정 -->
      <div class="confirm-card">
        <h2 class="section-title">
          <span>✅ 이달의 배당금 확정</span>
          <span class="section-sub">자동 저장 · 월별 기록</span>
        </h2>

        <div class="dividend-list" id="dividendList"></div>

        <div class="confirm-total-box">
          <div class="confirm-total-label">
            <span>확정 예정 배당금액</span>
            <span id="totalSharesText">총 0주</span>
          </div>
          <div class="confirm-total-amount" id="totalDividend">0원</div>
        </div>

        <div class="confirm-row">
          <input type="month" class="month-input" id="targetMonthInput" onchange="onTargetMonthChange()" />
          <button class="confirm-btn" onclick="confirmMonthlyDividend()">이번 달 확정</button>
        </div>
        <div class="confirm-message" id="confirmMessage"></div>
      </div>
    </div>

    <div class="view" id="view-history">
      <div class="total-box">
        <div class="total-label">
          <span>누적 확정 배당금 합계</span>
          <span id="historyCountText">0개월 기록</span>
        </div>
        <div class="total-amount" id="cumulativeDividend">0원</div>
      </div>

      <div class="history-card">
        <h2 class="section-title">
          <span>📅 월별 확정 배당금 정리</span>
          <span class="section-sub">최신순</span>
        </h2>
        <div id="historyList"></div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "dividend_accumulator_v4";
    let isComposing = false;

    function getCurrentYearMonth() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      return `${y}-${m}`;
    }

    const defaultData = {
      activeView: "tracker",
      selectedIndex: 0,
      targetMonth: getCurrentYearMonth(),
      stocks: [
        { name: "", draftName: "", count: 0, dividend: 0 },
        { name: "", draftName: "", count: 0, dividend: 0 },
        { name: "", draftName: "", count: 0, dividend: 0 }
      ],
      confirmedMonths: []
    };

    let state = loadState();

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && Array.isArray(parsed.stocks) && parsed.stocks.length === 3) {
            return {
              ...defaultData,
              ...parsed,
              stocks: parsed.stocks.map((s) => ({
                name: s.name || "",
                draftName: typeof s.draftName === "string" ? s.draftName : (s.name || ""),
                count: Number(s.count) || 0,
                dividend: Number(s.dividend) || 0
              })),
              confirmedMonths: Array.isArray(parsed.confirmedMonths) ? parsed.confirmedMonths : []
            };
          }
        }
      } catch (e) {}
      return JSON.parse(JSON.stringify(defaultData));
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    function formatNumber(num) {
      return Math.round(num).toLocaleString("ko-KR");
    }

    function getDisplayName(stock, index) {
      const trimmed = (stock.name || "").trim();
      return trimmed ? trimmed : `구분 ${index + 1}`;
    }

    function switchView(viewName) {
      state.activeView = viewName;
      saveState();
      render();
    }

    function selectStock(index) {
      if (state.selectedIndex === index) return;
      state.selectedIndex = index;
      saveState();
      render();
    }

    function updateDraftName(index, value) {
      state.stocks[index].draftName = value;
      saveState();
    }

    function confirmStockName(index) {
      const inputEl = document.getElementById(`name-input-${index}`);
      const val = inputEl ? inputEl.value.trim() : (state.stocks[index].draftName || "").trim();
      state.stocks[index].draftName = val;
      state.stocks[index].name = val;
      saveState();
      render();
    }

    function changeCount(delta) {
      const stock = state.stocks[state.selectedIndex];
      stock.count = Math.max(0, stock.count + delta);
      saveState();
      render();
    }

    function updateDividend(index, value) {
      const num = parseFloat(value);
      state.stocks[index].dividend = isNaN(num) || num < 0 ? 0 : num;
      saveState();
      renderTotalsOnly();
    }

    function onTargetMonthChange() {
      const val = document.getElementById("targetMonthInput").value;
      if (val) {
        state.targetMonth = val;
        saveState();
      }
    }

    function confirmMonthlyDividend() {
      const month = state.targetMonth || getCurrentYearMonth();
      const items = state.stocks.map((s, idx) => ({
        name: getDisplayName(s, idx),
        count: s.count,
        dividend: s.dividend,
        subtotal: s.count * s.dividend
      }));
      const totalDividend = items.reduce((acc, item) => acc + item.subtotal, 0);
      const totalShares = items.reduce((acc, item) => acc + item.count, 0);

      const existingIdx = state.confirmedMonths.findIndex((m) => m.month === month);
      if (existingIdx >= 0) {
        const ok = confirm(`${month} 확정 배당금 기록이 이미 있습니다. 덮어쓸까요?`);
        if (!ok) return;
      }

      const record = {
        month,
        totalDividend,
        totalShares,
        items,
        confirmedAt: new Date().toLocaleString("ko-KR")
      };

      if (existingIdx >= 0) {
        state.confirmedMonths[existingIdx] = record;
      } else {
        state.confirmedMonths.push(record);
      }

      state.confirmedMonths.sort((a, b) => b.month.localeCompare(a.month));
      saveState();

      document.getElementById("confirmMessage").textContent =
        `${month} 배당금 ${formatNumber(totalDividend)}원으로 확정되었습니다.`;
      renderHistory();
    }

    function deleteMonthRecord(month) {
      if (!confirm(`${month} 확정 내역을 삭제할까요?`)) return;
      state.confirmedMonths = state.confirmedMonths.filter((m) => m.month !== month);
      saveState();
      renderHistory();
    }

    function resetAll() {
      if (!confirm("모든 종목명, 수량, 배당금 및 확정 내역을 초기화할까요?")) return;
      state = JSON.parse(JSON.stringify(defaultData));
      saveState();
      render();
    }

    function renderTotalsOnly() {
      let totalDiv = 0;
      let totalShares = 0;

      state.stocks.forEach((stock, idx) => {
        const sub = stock.count * stock.dividend;
        totalDiv += sub;
        totalShares += stock.count;
        const subEl = document.getElementById(`subtotal-${idx}`);
        if (subEl) {
          subEl.textContent = `${formatNumber(sub)}원`;
        }
      });

      document.getElementById("totalSharesText").textContent = `총 ${formatNumber(totalShares)}주`;
      document.getElementById("totalDividend").textContent = `${formatNumber(totalDiv)}원`;
    }

    function renderHistory() {
      const listEl = document.getElementById("historyList");
      const cumEl = document.getElementById("cumulativeDividend");
      const countEl = document.getElementById("historyCountText");

      const cumulative = state.confirmedMonths.reduce((sum, r) => sum + r.totalDividend, 0);
      cumEl.textContent = `${formatNumber(cumulative)}원`;
      countEl.textContent = `${state.confirmedMonths.length}개월 기록`;

      if (state.confirmedMonths.length === 0) {
        listEl.innerHTML = `<div class="empty-state">아직 확정된 월별 배당금 내역이 없습니다.<br />적립기 하단에서 배당금을 확정해 보세요.</div>`;
        return;
      }

      listEl.innerHTML = "";
      state.confirmedMonths.forEach((rec) => {
        const lines = rec.items
          .map((it) => `• ${it.name}: ${formatNumber(it.count)}주 × ${formatNumber(it.dividend)}원 = ${formatNumber(it.subtotal)}원`)
          .join("<br />");

        const itemDiv = document.createElement("div");
        itemDiv.className = "history-item";
        itemDiv.innerHTML = `
          <div class="history-top">
            <span class="history-month">${rec.month}</span>
            <span class="history-total">${formatNumber(rec.totalDividend)}원</span>
          </div>
          <div class="history-detail">${lines}</div>
          <div class="history-actions">
            <button class="delete-btn" onclick="deleteMonthRecord('${rec.month}')">삭제</button>
          </div>
        `;
        listEl.appendChild(itemDiv);
      });
    }

    function render() {
      document.getElementById("nav-tracker").classList.toggle("active", state.activeView === "tracker");
      document.getElementById("nav-history").classList.toggle("active", state.activeView === "history");
      document.getElementById("view-tracker").classList.toggle("active", state.activeView === "tracker");
      document.getElementById("view-history").classList.toggle("active", state.activeView === "history");

      document.getElementById("targetMonthInput").value = state.targetMonth || getCurrentYearMonth();

      const tabsEl = document.getElementById("tabs");
      tabsEl.innerHTML = "";

      state.stocks.forEach((stock, idx) => {
        const isActive = idx === state.selectedIndex;
        const card = document.createElement("div");
        card.className = `tab-card ${isActive ? "active" : ""}`;

        card.innerHTML = `
          <div class="tab-select-area" onclick="selectStock(${idx})">
            <div class="tab-badge">
              <span>구분 ${idx + 1}</span>
              <span>${isActive ? "●" : ""}</span>
            </div>
          </div>
          <div class="tab-name-edit">
            <input
              type="text"
              inputmode="text"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false"
              id="name-input-${idx}"
              class="tab-name-input"
              value="${(stock.draftName || "").replace(/"/g, "&quot;")}"
              placeholder="종목명 입력"
              oncompositionstart="isComposing = true"
              oncompositionend="isComposing = false; updateDraftName(${idx}, this.value)"
              oninput="updateDraftName(${idx}, this.value)"
              onkeydown="if(event.key==='Enter' && !isComposing){ event.preventDefault(); confirmStockName(${idx}); }"
            />
            <button type="button" class="tab-apply-btn" title="확정" aria-label="종목명 확인" onclick="confirmStockName(${idx})">✓</button>
          </div>
          <div class="tab-count" onclick="selectStock(${idx})">${formatNumber(stock.count)}주</div>
        `;
        tabsEl.appendChild(card);
      });

      const current = state.stocks[state.selectedIndex];
      document.getElementById("selectedTitle").textContent = getDisplayName(current, state.selectedIndex);
      document.getElementById("dialNumber").textContent = formatNumber(current.count);

      const divListEl = document.getElementById("dividendList");
      divListEl.innerHTML = "";

      state.stocks.forEach((stock, idx) => {
        const sub = stock.count * stock.dividend;
        const row = document.createElement("div");
        row.className = "dividend-row";
        row.innerHTML = `
          <div class="dividend-row-top">
            <span class="dividend-stock-name">${getDisplayName(stock, idx)}</span>
            <span class="dividend-stock-qty">${formatNumber(stock.count)}주 보유</span>
          </div>
          <div class="dividend-row-bottom">
            <div class="input-group">
              <input
                type="number"
                inputmode="decimal"
                min="0"
                step="any"
                placeholder="주당분배금 입력"
                value="${stock.dividend === 0 ? "" : stock.dividend}"
                oninput="updateDividend(${idx}, this.value)"
              />
              <span class="input-unit">원/주</span>
            </div>
            <div class="row-subtotal" id="subtotal-${idx}">${formatNumber(sub)}원</div>
          </div>
        `;
        divListEl.appendChild(row);
      });

      renderTotalsOnly();
      renderHistory();
    }

    render();
  </script>
</body>
</html>
